<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Invite Moi ! · Fais-toi inviter, ou invite</title>
    <meta name="description" content="Des sorties à deux : restos, théâtre, expos, concerts. Propose d'inviter quelqu'un, ou fais-toi inviter. Démo interactive." />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#FAF6F0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14110E" media="(prefers-color-scheme: dark)" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Invite Moi ! · Fais-toi inviter, ou invite" />
    <meta property="og:description" content="Des sorties à deux : restos, théâtre, expos, concerts. Démo interactive." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:locale" content="fr_FR" />
    <script>
      // Applique le thème avant le premier rendu pour éviter le flash.
      try {
        var t = localStorage.getItem('invitemoi-theme') || 'system';
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
